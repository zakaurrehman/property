name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3100

jobs:
  build:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Build-time only — nothing queries the database during `next build`
      # (every data route is dynamic and the sitemap is request-time).
      DATABASE_URL: "postgres://user:pass@localhost:5432/ci?sslmode=disable"
      AUTH_SECRET: "ci-only-secret-not-used-anywhere-else"
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — it comes from package.json#packageManager, and
      # pnpm/action-setup refuses to run when both are given.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estate_bureau
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/estate_bureau?sslmode=disable"
      AUTH_SECRET: "ci-only-secret-not-used-anywhere-else"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
